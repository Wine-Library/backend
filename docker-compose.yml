services:

  wine-service-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: wine-service-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - wine-service-data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d wine-service-db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  java-server:
    build:
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    volumes:
      - maven-cache:/root/.m2
      - ./uploads:/app/uploads
    ports:
      - "8091:8090"
    depends_on:
      wine-service-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8090/api/v1/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 500s
    restart: on-failure

volumes:
  wine-service-data:
  maven-cache:
