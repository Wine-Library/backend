        - update:
            tableName: users
            columns:
              - column:
                  name: name
                  value: Vasyl
              - column:
                  name: surname
                  value: Stus
              - column:
                  name: phone_number
                  value: "+380987777777"
              - column:
                  name: shipping_address
                  value: "Chernihiv"
