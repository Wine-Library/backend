databaseChangeLog:
  - changeSet:
      id: 04-create-wines-table
      author: kastashenkova
      changes:
        - createTable:
            tableName: wines
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: wine_name
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: price
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: country_of_origin
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: wine_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: popularity_rating
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: occasion
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: product_image
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
