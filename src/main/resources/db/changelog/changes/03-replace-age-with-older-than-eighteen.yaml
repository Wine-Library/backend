databaseChangeLog:
  - changeSet:
      id: 03-replace-age-with-older-than-eighteen
      author: kastashenkova
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: older_than_eighteen
                  type: boolean
                  defaultValueBoolean: false

        - update:
            tableName: users
            columns:
              - column:
                  name: older_than_eighteen
                  valueBoolean: true
            where: age >= 18

        - update:
            tableName: users
            columns:
              - column:
                  name: older_than_eighteen
                  valueBoolean: false
            where: age < 18

        - addNotNullConstraint:
            tableName: users
            columnName: older_than_eighteen
            columnDataType: boolean

        - dropColumn:
            tableName: users
            columnName: age

        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: astashenkova.katya@gmail.com
              - column:
                  name: password
                  value: $2a$10$G2OoeNY26fSUG0QFW5TTMupfHWEB5akpHsXDlVKsTOXIlb1jgD1mK # admin123
              - column:
                  name: older_than_eighteen
                  valueBoolean: true
