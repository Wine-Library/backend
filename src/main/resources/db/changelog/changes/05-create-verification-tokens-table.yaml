databaseChangeLog:
  - changeSet:
      id: 05-create-verification-tokens-table
      author: kastashenkova
      changes:
        - createTable:
            tableName: verification_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_verification_token_user
                    references: users(id)
              - column:
                  name: expiry_date
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: token_type
                  type: varchar(50)
                  constraints:
                    nullable: false
