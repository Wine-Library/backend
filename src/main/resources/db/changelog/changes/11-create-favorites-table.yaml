databaseChangeLog:
  - changeSet:
      id: 11-create-favorites-table
      author: kastashenkova
      changes:
        - createTable:
            tableName: favorites
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: wine_id
                  type: bigint
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: favorites
            columnNames: user_id, wine_id
            constraintName: pk_favorites

        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_favorites_user

        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: wine_id
            referencedTableName: wines
            referencedColumnNames: id
            constraintName: fk_favorites_wine
