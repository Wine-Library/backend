databaseChangeLog:
  - changeSet:
      id: 13-create-cart-items-table
      author: kastashenkova
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: shopping_cart_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: wine_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: shopping_cart_id
            referencedTableName: shopping_carts
            referencedColumnNames: id
            constraintName: fk_cart_items_shopping_cart

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: wine_id
            referencedTableName: wines
            referencedColumnNames: id
            constraintName: fk_cart_items_wine

        - addUniqueConstraint:
            tableName: cart_items
            columnNames: shopping_cart_id, wine_id
            constraintName: uk_cart_items_cart_wine
